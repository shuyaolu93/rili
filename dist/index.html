<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rili 是一个面向投资研究的中文事件日历，展示未来两周事件，统一使用北京时间，并自动更新。" />
  <title>Rili · 事件日历</title>
  <style>
    :root{--paper:#f7f4ec;--ink:#23211e;--muted:#817b70;--line:#dfd9ce;--accent:#ab4436;--gold:#d89a24;--wash:#f4dfd8;--card:#fcfaf5;--green:#31765e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-serif,"Songti SC","Noto Serif SC",STSong,serif}button{font:inherit;color:inherit}.shell{max-width:1280px;margin:auto;padding:0 42px 72px}.topbar{height:82px;margin:0 -42px;border-bottom:1px solid #e6dfd4;display:flex;align-items:center;padding:0 42px;justify-content:space-between;background:rgba(250,247,240,.75)}.brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:800}.mark{height:32px;width:32px;border:1px solid var(--ink);display:grid;place-items:center;font-family:Georgia;font-size:11px;line-height:9px;text-align:center}.actions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:transparent;border-radius:10px;width:36px;height:34px;color:#9e8252}.profile{width:auto;padding:0 12px;letter-spacing:.04em}.hero{padding:25px 0 17px}.hero h1{font-size:31px;margin:0 0 6px;letter-spacing:.06em}.hero p,.subtitle{margin:0;color:var(--muted);font-size:14px}.rule{border-top:2px solid #6d6a65;margin:2px 0 17px}.window-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.window-label,.kicker{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:var(--muted)}.window-range{font-size:18px;font-weight:700;margin-left:13px}.window-meta{font-size:12px;color:var(--muted)}.date-strip{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbf9f3}.day{min-height:61px;text-align:center;padding:8px 2px;border-right:1px solid var(--line);position:relative;font-size:14px}.day:last-child{border:0}.day small{color:#999186;display:block;font-size:10px;margin-bottom:3px}.day.today{color:var(--accent);font-weight:700}.day.selected{background:#f0e3dd}.dots{position:absolute;bottom:7px;left:0;right:0;color:var(--accent);font-size:13px;letter-spacing:1px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:30px 0 45px}.filter{min-height:110px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px;cursor:pointer;transition:.18s}.filter:hover{transform:translateY(-2px);border-color:#a79a86}.filter.active{outline:2px solid var(--accent);outline-offset:3px;border-color:var(--accent)}.filter .name{font-family:ui-monospace,monospace;color:var(--muted);font-size:10px;letter-spacing:.22em}.filter strong{font-family:Georgia,serif;font-size:33px;line-height:1.28;display:block;margin-top:11px;font-variant-numeric:tabular-nums}.filter strong span{font-size:inherit;margin-left:4px}.filter b{font-size:14px}.section-heading{display:flex;gap:16px;align-items:baseline;margin-bottom:17px}.section-heading h2{font-size:26px;margin:0}.event-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.group{padding:19px 20px 0}.group-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;color:var(--accent);font-weight:700}.group-head .count{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}.countdown{font-family:ui-monospace,monospace;font-size:10px;border:1px solid var(--line);padding:2px 5px;border-radius:2px;color:var(--muted)}.event{display:grid;grid-template-columns:80px 62px minmax(190px,1.7fr) 1fr 90px 90px 74px;align-items:center;min-height:59px;border-bottom:1px solid #ebe5db;font-size:14px}.event:last-child{border-bottom:0}.event.emphasis{background:var(--wash);margin:0 -20px;padding:0 20px}.time{font-family:ui-monospace,monospace;color:#665f55;font-size:14px}.stars{letter-spacing:1px;color:#d8d2c8}.stars.hot{color:var(--gold)}.event-name{font-weight:700;font-size:15px}.period{color:#615c54}.actual{font-weight:700;text-align:right}.expected,.previous{text-align:right;color:#615c54}.delta{text-align:right;font-family:ui-monospace,monospace;font-size:14px}.up{color:var(--green)}.down{color:var(--accent)}.empty{padding:44px;text-align:center;color:var(--muted);display:none}.footer{font-size:11px;color:var(--muted);margin:18px 2px}.legend{color:var(--gold)}
    .filters{display:none!important}
    @media(max-width:850px){.shell{padding:0 18px 40px}.topbar{padding:0 18px;margin:0 -18px;height:66px}.profile{display:none}.hero h1{font-size:25px}.window-meta{display:none}.date-strip{overflow:auto;grid-template-columns:repeat(7,62px)}.filters{grid-template-columns:repeat(2,1fr);margin:22px 0 33px}.filter{min-height:90px;padding:12px}.filter strong{font-size:27px;margin-top:7px}.event{grid-template-columns:60px 46px minmax(140px,1fr) 54px;gap:5px}.period,.expected,.previous{display:none}.actual,.delta{text-align:left}.group{padding:15px 12px 0}.event.emphasis{margin:0 -12px;padding:0 12px}.event-name{font-size:14px}.footer{line-height:1.7}}
    /* Keep every displayed numeric value at one consistent size. */
    .window-range,.window-meta,.day,.filter strong,.filter strong span,.group-head .count,.countdown,.time,.actual,.expected,.delta,.footer{font-size:16px!important}
    .filter strong{display:flex!important;align-items:center;gap:4px;white-space:nowrap}
    .filter .metric-value,.filter .metric-unit{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;font-size:32px!important;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;line-height:1}
    /* Premium fintech visual refresh */
    :root{--paper:#f5f8fb;--ink:#10233f;--muted:#6d7b8d;--line:#dce5ee;--accent:#0d5c63;--gold:#c7953f;--wash:#e7f3f1;--card:#ffffff;--green:#16856f}
    body{background:linear-gradient(180deg,#f8fafc 0%,#eef4f7 100%);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    .shell{max-width:1320px;padding:0 48px 76px}
    .topbar{height:76px;margin:0 -48px;padding:0 48px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);box-shadow:0 1px 12px rgba(16,35,63,.04)}
    .brand{font-size:17px;letter-spacing:.01em}.mark{border:0;border-radius:9px;background:#10233f;color:#fff;font-family:Inter,sans-serif;font-size:9px;line-height:9px;box-shadow:0 5px 12px rgba(16,35,63,.18)}
    .icon{border:1px solid var(--line);background:#fff;border-radius:9px;color:#0d5c63}.hero{padding:38px 0 22px}.hero h1{font-size:34px;letter-spacing:-.03em}.hero p,.subtitle{color:var(--muted)}.rule{border-top:3px solid var(--ink);margin:0 0 18px}.window-label,.kicker{color:var(--muted);letter-spacing:.18em}.window-range{color:var(--ink);letter-spacing:-.02em}.window-meta{color:var(--muted)}
    .date-strip{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(16,35,63,.05)}.day{min-height:66px;border-color:var(--line);color:#334862;cursor:pointer;transition:background .15s,box-shadow .15s}.day:hover{background:#f0f7f7}.day.today{color:#0d5c63}.day.selected,.day.picked{background:#e7f3f1;box-shadow:inset 0 -3px 0 #0d5c63}.dots{color:#0d5c63}
    .section-heading{margin:30px 0 15px}.section-heading h2{font-size:25px;letter-spacing:-.02em}.event-card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(16,35,63,.06)}.group{padding:20px 24px 0}.group-head{color:#0d5c63;border-color:var(--line)}.countdown{border-color:#b9d8d4;color:#0d5c63;background:#f1faf8}.event{border-color:#edf1f5;min-height:62px}.event.emphasis{background:#e7f3f1}.event-name{color:#10233f}.actual{color:#10233f}.up{color:#16856f}.down{color:#b44f4f}.footer{color:var(--muted)}
    .event{grid-template-columns:80px 92px minmax(190px,1.7fr) 1fr 110px 110px}.importance{font-size:13px!important;font-weight:700;letter-spacing:.02em;color:#6d7b8d}.importance.high{color:#b8791d}.importance.medium{color:#0d5c63}.importance.low{color:#8b98a8}.actual,.expected{display:flex;flex-direction:column;gap:2px}.actual small,.expected small{font-size:10px!important;font-weight:500;color:#8b98a8;letter-spacing:.08em}.actual{font-weight:700}.expected{font-weight:600}.delta{display:none!important}
    @media(max-width:850px){.event{grid-template-columns:64px 74px minmax(130px,1fr) 70px 84px}.period{display:none}.expected{display:flex}.actual,.expected{text-align:left}.event .actual small,.event .expected small{display:block}}
    @media(max-width:850px){.shell{padding:0 18px 44px}.topbar{padding:0 18px;margin:0 -18px}.hero{padding-top:28px}.group{padding:16px 14px 0}.event.emphasis{margin:0 -14px;padding:0 14px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="mark">RILI<br>日历</div>Rili 事件日历</div></header>
    <main>
      <section class="hero"><h1>事件日历</h1><p>Rili 是一个面向投资研究的中文事件日历，展示未来两周事件，统一使用北京时间，并自动更新。</p></section>
      <div class="rule"></div>
      <section><div class="window-head"><div><span class="window-label">WINDOW</span><span class="window-range" id="windowRange"></span></div><div class="window-meta">滚动窗口　·　自今日起　<strong>7</strong> 天</div></div><div class="date-strip" id="dates"></div></section>
      <section><div class="section-heading"><h2>日程</h2><p class="subtitle">最新事件 · 时间为北京时间</p></div><div class="event-card" id="calendar"></div><div class="empty" id="empty">正在获取最新事件…</div></section>
      <p class="footer">重要性：高 / 中 / 低　·　实际：已公布值　·　预期：市场预期值　·　北京时间自动更新（每 30 分钟）</p>
    </main>
  </div>
  <script>
    const TIME_ZONE='Asia/Shanghai';
    const weekday=['日','一','二','三','四','五','六'];
    const liveDates=Array.from({length:7},(_,i)=>{const d=new Date(new Date().toLocaleString('en-US',{timeZone:TIME_ZONE}));d.setHours(0,0,0,0);d.setDate(d.getDate()+i);const month=d.getMonth()+1;const day=d.getDate();return [weekday[d.getDay()],`${month}月${day}日`,i===0?'today':'','',`${month}-${day}`];});
    document.querySelector('#windowRange').textContent=`${liveDates[0][1]} → ${liveDates[liveDates.length-1][1]}`;
    document.querySelector('#dates').innerHTML=liveDates.map(([w,n,c,d,key])=>`<div class="day ${c}" data-date="${key}" role="button" tabindex="0"><small>${c==='today'?'— 今日':w}</small>${n}<div class="dots">${d}</div></div>`).join('');
    let selectedDateKey=null;
    let data=[];
    const calendar=document.querySelector('#calendar'), empty=document.querySelector('#empty');
    function groupDateKey(label){const match=String(label).match(/(\d{1,2})\D+(\d{1,2})/);return match?`${Number(match[1])}-${Number(match[2])}`:null;}
    function render(){let visible=data;if(selectedDateKey)visible=visible.filter(group=>(group.dateKey||groupDateKey(group.day))===selectedDateKey);calendar.innerHTML=visible.map(g=>`<div class="group"><div class="group-head">●　${g.day}<span class="count">${g.items.length} 项</span></div>${g.items.map(e=>{const level=e[1].includes('★★★')?'高':e[1].includes('★★')?'中':'低';const levelClass=level==='高'?'high':level==='中'?'medium':'low';const clean=value=>String(value??'—').replace(/[▲▼]/g,'').trim();return `<div class="event"><span class="time">${e[0]}</span><span class="importance ${levelClass}">重要性：${level}</span><span class="event-name">${e[2]}</span><span class="period">${e[3]}</span><span class="actual"><small>实际</small>${clean(e[4])}</span><span class="expected"><small>预期</small>${clean(e[5])}</span></div>`}).join('')}</div>`).join('');calendar.style.display=visible.length?'block':'none';empty.style.display=visible.length?'none':'block';empty.textContent=selectedDateKey?'该日期暂无事件':(data.length?'暂无事件':'正在获取最新事件…')}
    document.querySelectorAll('.day').forEach(day=>{const choose=()=>{selectedDateKey=day.dataset.date;document.querySelectorAll('.day').forEach(item=>item.classList.toggle('picked',item===day));render();};day.addEventListener('click',choose);day.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});});
    render();
    const feedUrl='/api/calendar';
    const updateLabel=document.querySelector('.footer');
    function formatFeedDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?null:d;}
    const TITLE_TRANSLATIONS={'Nonfarm Payrolls':'非农就业人数','Unemployment Rate':'失业率','CPI':'消费者物价指数','Core CPI':'核心消费者物价指数','PPI':'生产者物价指数','Core PPI':'核心生产者物价指数','GDP':'国内生产总值','Retail Sales':'零售销售','Initial Jobless Claims':'初请失业金人数','Continuing Jobless Claims':'续请失业金人数','PMI':'采购经理人指数','ISM Manufacturing PMI':'ISM制造业采购经理人指数','ISM Services PMI':'ISM服务业采购经理人指数','Consumer Confidence':'消费者信心指数','Housing Starts':'新屋开工','Building Permits':'营建许可','Existing Home Sales':'成屋销售','New Home Sales':'新屋销售','Durable Goods Orders':'耐用品订单','Trade Balance':'贸易帐','Industrial Production':'工业产出','Pending Home Sales':'成屋签约销售','Interest Rate Decision':'利率决议','Federal Funds Rate':'联邦基金利率','FOMC':'联邦公开市场委员会','Fed Chair':'美联储主席讲话','ECB':'欧洲央行','BOJ':'日本央行','RBA':'澳洲联储','SNB':'瑞士央行','OPEC':'石油输出国组织','Crude Oil Inventories':'原油库存','Natural Gas Storage':'天然气库存','Michigan Consumer Sentiment':'密歇根大学消费者信心指数','Wholesale Inventories':'批发库存','Business Inventories':'商业库存','ADP Employment Change':'ADP就业人数变化','JOLTS Job Openings':'JOLTS职位空缺','Average Hourly Earnings':'平均时薪','Average Weekly Hours':'平均每周工时','Personal Income':'个人收入','Personal Spending':'个人支出','Core PCE Price Index':'核心个人消费支出价格指数','PCE Price Index':'个人消费支出价格指数','Factory Orders':'工厂订单','Capacity Utilization':'产能利用率','Leading Indicators':'领先指标'};
    function translateTitle(title){const value=String(title||'').trim();if(!value||/[^\x00-\x7F]/.test(value))return value;if(TITLE_TRANSLATIONS[value])return TITLE_TRANSLATIONS[value];const matched=Object.keys(TITLE_TRANSLATIONS).find(key=>value.toLowerCase().includes(key.toLowerCase()));return matched?value.replace(new RegExp(matched,'ig'),TITLE_TRANSLATIONS[matched]):'其他经济事件';}
    function liveGroups(items){const groups={};const allowed=new Set(liveDates.map(date=>date[4]));for(const item of items){const d=formatFeedDate(item.date);if(!d||!item.title)continue;const parts=new Intl.DateTimeFormat('en-US',{timeZone:TIME_ZONE,month:'numeric',day:'numeric'}).formatToParts(d);const month=parts.find(part=>part.type==='month')?.value;const day=parts.find(part=>part.type==='day')?.value;const dateKey=`${Number(month)}-${Number(day)}`;if(!allowed.has(dateKey))continue;const key=d.toLocaleDateString('zh-CN',{timeZone:TIME_ZONE,weekday:'short',month:'numeric',day:'numeric'});(groups[dateKey]??={day:key,dateKey,items:[]}).items.push([d.toLocaleTimeString('en-US',{timeZone:TIME_ZONE,hour:'2-digit',minute:'2-digit',hour12:false}),String(item.impact).toLowerCase()==='high'?'★★★':String(item.impact).toLowerCase()==='medium'?'★★☆':'★☆☆',translateTitle(item.title),item.country||'—',item.actual||'未公布',item.forecast||'—','—','',d.getTime()]);}return Object.values(groups).sort((a,b)=>liveDates.findIndex(d=>d[4]===a.dateKey)-liveDates.findIndex(d=>d[4]===b.dateKey)).map(group=>({...group,items:group.items.sort((a,b)=>(a[8]||0)-(b[8]||0))}));}
    async function refreshCalendar(){try{const response=await fetch(feedUrl,{cache:'no-store'});if(!response.ok)throw new Error('feed '+response.status);const payload=await response.json();data=liveGroups(payload.events||payload);render();const now=new Date().toLocaleString('zh-CN',{timeZone:TIME_ZONE,hour12:false});updateLabel.textContent=`重要性：高 / 中 / 低　·　实际：已公布值　·　预期：市场预期值　·　北京时间 ${now} 自动更新（每 30 分钟）`;}catch(error){data=[];render();updateLabel.textContent='暂时无法获取最新事件，请稍后刷新。';}}
    refreshCalendar();
    setInterval(refreshCalendar,30*60*1000);
  </script>
</body>
</html>
