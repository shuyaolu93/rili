<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rili 投资事件日历" />
  <title>Rili · 事件日历</title>
  <style>
    :root{--paper:#f7f4ec;--ink:#23211e;--muted:#817b70;--line:#dfd9ce;--accent:#ab4436;--gold:#d89a24;--wash:#f4dfd8;--card:#fcfaf5;--green:#31765e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-serif,"Songti SC","Noto Serif SC",STSong,serif}button{font:inherit;color:inherit}.shell{max-width:1280px;margin:auto;padding:0 42px 72px}.topbar{height:82px;margin:0 -42px;border-bottom:1px solid #e6dfd4;display:flex;align-items:center;padding:0 42px;justify-content:space-between;background:rgba(250,247,240,.75)}.brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:800}.mark{height:32px;width:32px;border:1px solid var(--ink);display:grid;place-items:center;font-family:Georgia;font-size:11px;line-height:9px;text-align:center}.actions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:transparent;border-radius:10px;width:36px;height:34px;color:#9e8252}.profile{width:auto;padding:0 12px;letter-spacing:.04em}.hero{padding:25px 0 17px}.hero h1{font-size:31px;margin:0 0 6px;letter-spacing:.06em}.hero p,.subtitle{margin:0;color:var(--muted);font-size:14px}.rule{border-top:2px solid #6d6a65;margin:2px 0 17px}.window-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.window-label,.kicker{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:var(--muted)}.window-range{font-size:18px;font-weight:700;margin-left:13px}.window-meta{font-size:12px;color:var(--muted)}.date-strip{display:grid;grid-template-columns:repeat(14,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbf9f3}.day{min-height:61px;text-align:center;padding:8px 2px;border-right:1px solid var(--line);position:relative;font-size:14px}.day:last-child{border:0}.day small{color:#999186;display:block;font-size:10px;margin-bottom:3px}.day.today{color:var(--accent);font-weight:700}.day.selected{background:#f0e3dd}.dots{position:absolute;bottom:7px;left:0;right:0;color:var(--accent);font-size:13px;letter-spacing:1px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:30px 0 45px}.filter{min-height:110px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px;cursor:pointer;transition:.18s}.filter:hover{transform:translateY(-2px);border-color:#a79a86}.filter.active{outline:2px solid var(--accent);outline-offset:3px;border-color:var(--accent)}.filter .name{font-family:ui-monospace,monospace;color:var(--muted);font-size:10px;letter-spacing:.22em}.filter strong{font-family:Georgia,serif;font-size:33px;line-height:1.28;display:block;margin-top:11px;font-variant-numeric:tabular-nums}.filter strong span{font-size:inherit;margin-left:4px}.filter b{font-size:14px}.section-heading{display:flex;gap:16px;align-items:baseline;margin-bottom:17px}.section-heading h2{font-size:26px;margin:0}.event-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.group{padding:19px 20px 0}.group-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;color:var(--accent);font-weight:700}.group-head .count{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}.countdown{font-family:ui-monospace,monospace;font-size:10px;border:1px solid var(--line);padding:2px 5px;border-radius:2px;color:var(--muted)}.event{display:grid;grid-template-columns:80px 62px minmax(190px,1.7fr) 1fr 90px 90px 74px;align-items:center;min-height:59px;border-bottom:1px solid #ebe5db;font-size:14px}.event:last-child{border-bottom:0}.event.emphasis{background:var(--wash);margin:0 -20px;padding:0 20px}.time{font-family:ui-monospace,monospace;color:#665f55;font-size:14px}.stars{letter-spacing:1px;color:#d8d2c8}.stars.hot{color:var(--gold)}.event-name{font-weight:700;font-size:15px}.period{color:#615c54}.actual{font-weight:700;text-align:right}.expected,.previous{text-align:right;color:#615c54}.delta{text-align:right;font-family:ui-monospace,monospace;font-size:14px}.up{color:var(--green)}.down{color:var(--accent)}.empty{padding:44px;text-align:center;color:var(--muted);display:none}.footer{font-size:11px;color:var(--muted);margin:18px 2px}.legend{color:var(--gold)}
    @media(max-width:850px){.shell{padding:0 18px 40px}.topbar{padding:0 18px;margin:0 -18px;height:66px}.profile{display:none}.hero h1{font-size:25px}.window-meta{display:none}.date-strip{overflow:auto;grid-template-columns:repeat(14,62px)}.filters{grid-template-columns:repeat(2,1fr);margin:22px 0 33px}.filter{min-height:90px;padding:12px}.filter strong{font-size:27px;margin-top:7px}.event{grid-template-columns:60px 46px minmax(140px,1fr) 54px;gap:5px}.period,.expected,.previous{display:none}.actual,.delta{text-align:left}.group{padding:15px 12px 0}.event.emphasis{margin:0 -12px;padding:0 12px}.event-name{font-size:14px}.footer{line-height:1.7}}
    /* Keep every displayed numeric value at one consistent size. */
    .window-range,.window-meta,.day,.filter strong,.filter strong span,.group-head .count,.countdown,.time,.actual,.expected,.delta,.footer{font-size:16px!important}
    .filter strong{display:flex!important;align-items:center;gap:4px;white-space:nowrap}
    .filter .metric-value,.filter .metric-unit{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;font-size:32px!important;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;line-height:1}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="mark">RILI<br>日历</div>Rili 事件日历</div><div class="actions"><button class="icon" aria-label="搜索">⌕</button><button class="icon" aria-label="通知">♧</button><button class="icon profile">▦&nbsp; 事件工具箱⌄</button></div></header>
    <main>
      <section class="hero"><h1>事件日历</h1><p>未来两周的宏观日程、财报、IPO、拆股与分红，时间均为美东。</p></section>
      <div class="rule"></div>
      <section><div class="window-head"><div><span class="window-label">WINDOW</span><span class="window-range">09/21 → 10/04</span></div><div class="window-meta">滚动窗口　·　自今日起　<strong>14</strong> 天</div></div><div class="date-strip" id="dates"></div></section>
      <section class="filters" aria-label="事件分类"><button class="filter active" data-filter="all"><span class="name">Macro</span><strong><span class="metric-value">15</span><span class="metric-unit">项</span></strong><b>日程</b></button><button class="filter" data-filter="earnings"><span class="name">Earnings</span><strong><span class="metric-value">68</span><span class="metric-unit">家</span></strong><b>财报</b></button><button class="filter" data-filter="ipo"><span class="name">IPO</span><strong><span class="metric-value">3</span><span class="metric-unit">家</span></strong><b>IPO</b></button><button class="filter" data-filter="splits"><span class="name">Splits</span><strong><span class="metric-value">0</span><span class="metric-unit">起</span></strong><b>拆股</b></button><button class="filter" data-filter="dividends"><span class="name">Dividends</span><strong><span class="metric-value">5</span><span class="metric-unit">笔</span></strong><b>分红</b></button></section>
      <section><div class="section-heading"><h2>日程</h2><p class="subtitle">宏观数据与美联储日程 · 时间为美东</p></div><div class="event-card" id="calendar"></div><div class="empty" id="empty">该分类尚无演示事件。</div></section>
      <p class="footer"><span class="legend">★</span> = 事件重要性（满 3 星）　·　Δ = 实际 − 预期　·　数据每日更新 1 次（纽约时间 20:00 后）　·　演示数据</p>
    </main>
  </div>
  <script>
    const weekday=['日','一','二','三','四','五','六'];
    const liveDates=Array.from({length:14},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return [weekday[d.getDay()],String(d.getDate()).padStart(2,'0'),i===0?'today':(i===3?'selected':''),''];});
    document.querySelector('#dates').innerHTML=liveDates.map(([w,n,c,d])=>`<div class="day ${c}"><small>${c==='today'?'— 今日':w}</small>${n}<div class="dots">${d}</div></div>`).join('');
    let data=[
      {day:'周三 9/23',tag:'T-2',items:[['09:45','★★☆','标普全球制造业 PMI','Sep','53.6 ▼','53.9','-0.3','down'],['09:45','★★☆','标普全球服务业 PMI','Sep','56 ▼','56.5','-0.5','down']]},
      {day:'周四 9/24',tag:'T-3',items:[['08:30','★★☆','初请失业金人数','Sep/19','202 ▲','196','+6','up'],['10:00','★★☆','新屋销售总数','Aug','0.61 ▲','0.607','+0.003','up','emphasis']]},
      {day:'周五 9/25',tag:'T-4',items:[['08:30','★★☆','耐用品订单 月率','Aug','-0.5 ▼','1.1','-1.6','down']]},
      {day:'周二 9/29',tag:'T-8',items:[['10:00','★★☆','JOLTS 职位空缺','Aug','7.2 ▼','7.271','-0.07','down']]},
      {day:'周三 9/30',tag:'T-9',items:[['08:15','★★★','ADP 就业人数（小非农）','Sep','75 ▲','38','+37','up'],['08:30','★★★','核心 PCE 物价指数 年率','Aug','未公布','3.3','—','']]},
      {day:'周四 10/1',tag:'T-10',items:[['08:30','★★☆','初请失业金人数','Sep/26','未公布','—','—',''],['10:00','★★☆','ISM 制造业 PMI','Sep','54 ▼','54.6','-0.6','down']]},
      {day:'周五 10/2',tag:'T-11',items:[['08:30','★★★','非农就业人口','Sep','120 ▼','162','-42','down'],['08:30','★★★','失业率','Sep','4.3 ▲','4.1','+0.2','up'],['08:30','★☆☆','平均每小时工资 月率','Sep','0.2 ▼','0.3','-0.1','down'],['10:00','★★☆','ISM 非制造业 PMI','Sep','54 ▼','55.4','-1.4','down','emphasis']]}
    ];
    const calendar=document.querySelector('#calendar'), empty=document.querySelector('#empty');
    function render(filter='all'){const visible=filter==='all'?data:[];calendar.innerHTML=visible.map(g=>`<div class="group"><div class="group-head">●　${g.day}<span class="countdown">${g.tag}</span><span class="count">${g.items.length} 项</span></div>${g.items.map(e=>`<div class="event ${e[8]||''}"><span class="time">${e[0]}</span><span class="stars ${e[1].includes('★★★')?'hot':''}">${e[1]}</span><span class="event-name">${e[2]}</span><span class="period">${e[3]}</span><span class="actual">${e[4]}</span><span class="expected">${e[5]}</span><span class="delta ${e[7]||''}">${e[6]}</span></div>`).join('')}</div>`).join('');calendar.style.display=visible.length?'block':'none';empty.style.display=visible.length?'none':'block'}
    document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)}));render();
    const feedUrl='/api/calendar';
    const updateLabel=document.querySelector('.footer');
    function formatFeedDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?null:d;}
    function liveGroups(items){const groups={};for(const item of items){const d=formatFeedDate(item.date);if(!d||!item.title)continue;const key=d.toLocaleDateString('zh-CN',{weekday:'short',month:'numeric',day:'numeric'});(groups[key]??={day:key,tag:'LIVE',items:[]}).items.push([d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}),item.impact==='High'?'★★★':item.impact==='Medium'?'★★☆':'★☆☆',item.title,item.country||'—','未公布',item.forecast||'—','—','']);}return Object.values(groups).slice(0,14);}
    async function refreshCalendar(){try{const response=await fetch(feedUrl,{cache:'no-store'});if(!response.ok)throw new Error('feed '+response.status);const incoming=liveGroups(await response.json());if(incoming.length){data=incoming;render(document.querySelector('.filter.active')?.dataset.filter||'all');const now=new Date().toLocaleString('zh-CN',{hour12:false});updateLabel.innerHTML=`<span class="legend">★</span> = 事件重要性　·　Δ = 实际 − 预期　·　自动更新于 ${now}（每 30 分钟）`;localStorage.setItem('rili:last-data',JSON.stringify({data,updatedAt:now}));}}catch(error){const cached=localStorage.getItem('rili:last-data');if(cached){try{const saved=JSON.parse(cached);if(Array.isArray(saved.data)){data=saved.data;render(document.querySelector('.filter.active')?.dataset.filter||'all');}}catch(_){}}}}
    refreshCalendar();
    setInterval(refreshCalendar,30*60*1000);
    const filterLabels={earnings:'财报',ipo:'IPO',splits:'拆股',dividends:'分红'};
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.filter!=='all'){calendar.style.display='none';empty.style.display='block';empty.textContent=`${filterLabels[button.dataset.filter]}数据源尚未接入，当前自动更新服务提供宏观经济日历。`;}}));
  </script>
</body>
</html>
